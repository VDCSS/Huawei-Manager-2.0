name: CI

on: [push, pull_request]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: System dependencies (PySide6)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxcb-cursor-dev libxkbcommon-x11-dev libegl1 libgl1
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src/huawei_manager/
      - name: Test + Coverage (pytest)
        run: pytest tests/ -q --cov=src/huawei_manager --cov-report=term --cov-fail-under=60
      - name: Typecheck (pyright)
        run: pyright
