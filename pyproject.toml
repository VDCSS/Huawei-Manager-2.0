[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-manager"
version = "2.0.0"
description = "Huawei SSH/CLI Manager"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "netmiko>=4.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
    "PySide6>=6.8",
    "bcrypt>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["huawei_manager*"]

[tool.setuptools.package-data]
"huawei_manager.data" = ["*.json"]

[project.scripts]
huawei-manager = "huawei_manager:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.0", "pyright>=1.1.360", "pytest-qt>=4.2"]
qt = ["pyside6>=6.7"]
vault = ["hvac>=2.0"]
aws = ["boto3>=1.34"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["src/huawei_manager"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportCallIssue = "warning"
reportIncompatibleMethodOverride = "warning"
reportAttributeAccessIssue = "warning"
