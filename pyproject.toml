[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "huawei-manager"
version = "2.0.0"
description = "Huawei SSH/CLI Manager"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
    "netmiko>=4.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["huawei_manager*"]

[project.scripts]
huawei-manager = "huawei_manager:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.0", "pyright>=1.1.360"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
